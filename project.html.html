
<html>
<head>
    <title>Психологическое приложение</title>
    <link rel="stylesheet" href="Проект(css).css"> 
</head>
<body>
    <h1>Привет</h1>
    <p>Как ты себя чувствуешь сегодня?</p>

    <h2>Как работает приложение</h2>
    <ul>
        <li>Выбери эмоцию, которую ты испытываешь прямо сейчас</li>
        <li>Получи доступ к музыке, видео, упражнениям и статьям от психологов</li>
        <li>Веди психологический календарь и отслеживай свое состояние</li>
    </ul>

    <hr>

    <div class="header">
        <button class="tab active">Негативные эмоции</button>
        <button class="tab">Позитивные эмоции</button>
    </div>

    <div class="block">
        <div class="grid">
            <button class="btn emotion">Апатия</button>
            <button class="btn emotion">Гнев</button>
            <button class="btn emotion">Грусть</button>
            <button class="btn emotion">Одиночество</button>
            <button class="btn emotion">Паника</button>
            <button class="btn emotion">Страх</button>
            <button class="btn emotion">Стресс</button>
            <button class="btn emotion">Тревога</button>
        </div>
    </div>

    <p class="mater">Все материалы одобрены психологами</p>

   
</body>
</html>
