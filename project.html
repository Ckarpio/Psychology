
<html>
<head>
    <title>Психологическое приложение</title>
    <link rel="stylesheet" href="Проект(css).css"> 
</head>
<body>
    <h1>Привет</h1>
    <p>Как ты себя чувствуешь сегодня?</p>
    <div class="work">
    
        <h2 class="htw">Как работает приложение</h2>
        
         <ul class="htwl">
            <li>Выбери эмоцию, которую ты испытываешь прямо сейчас</li>
             <li>Получи доступ к музыке, видео, упражнениям и статьям от психологов</li>
            <li>Веди психологический календарь и отслеживай свое состояние</li>
        </ul>
    </div>

    <div class="emotoggle">
        <div class="toggle-bg"></div>
        <button class="toggle-btn active" data-tab="negative">Негативные эмоции</button>
        <button class="toggle-btn" data-tab="positive">Позитивные эмоции</button>
    </div>

    <div class="emo">
        <div class="grid">
            <button class="emotion">Апатия</button>
            <button class="emotion">Гнев</button>
            <button class="emotion">Грусть</button>
            <button class="emotion">Одиночество</button>
            <button class="emotion">Паника</button>
            <button class="emotion">Страх</button>
            <button class="emotion">Стресс</button>
            <button class="emotion">Тревога</button>
        </div>
    </div>

    <p class="mater">Все материалы одобрены психологами</p>

   
</body>
</html>
